name: Deploy to VPS

# Auto-deploy on every push to main (or run manually from the Actions tab).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never run two deploys at once; queue them instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (resilient to a flaky host)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          run_deploy() {
            ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=45 \
                -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
                -i ~/.ssh/id_ed25519 "$SSH_USER@$HOST" \
                'set -e; cd /var/www/sfs_gallery && git fetch --quiet origin main && git reset --hard --quiet origin/main && bash scripts/deploy.sh'
          }

          n=1
          max=6
          while true; do
            run_deploy && { echo "deploy succeeded on attempt $n"; exit 0; }
            rc=$?
            # rc 255 = SSH could not connect (host briefly unreachable) -> retry.
            # any other rc = the remote deploy script itself failed -> stop.
            if [ "$rc" -eq 255 ] && [ "$n" -lt "$max" ]; then
              echo "attempt $n: host unreachable (rc=255) — retrying in 60s"
              n=$((n + 1)); sleep 60; continue
            fi
            echo "::error::deploy failed (attempt $n, rc=$rc)"
            exit "$rc"
          done
